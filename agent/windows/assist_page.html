<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chloe · 临时远程协助</title><link rel="stylesheet" href="/app.css"><script src="/app.js" defer></script></head>
<body><main><header><p class="brand">Chloe Assist</p><h1>本次协助，由你授权。</h1><p>网页负责授权与控制，轻量连接器仅执行本机操作。你的电脑无需安装 Chloe 或任何模型。</p></header>
<p id="status" role="status" aria-live="polite">正在连接本机连接器…</p><p id="error" role="alert"></p>
<section id="pair"><h2>连接服务方</h2><form id="pair-form"><label>服务地址<input id="server" type="url" required spellcheck="false"></label><label>临时会话码<input id="code" required autocomplete="off" spellcheck="false"></label><button id="preview" type="submit">核对授权信息</button></form></section>
<section id="consent" hidden><h2>确认本次授权</h2><dl><dt>服务地址</dt><dd id="service"></dd><dt>服务方</dt><dd id="operator"></dd><dt>有效期至</dt><dd id="expires"></dd></dl><label>允许访问的目录<div class="directory"><input id="root" placeholder="选择目录或粘贴绝对路径" spellcheck="false"><button type="button" id="folder">选择目录</button></div></label><p id="folder-status" role="status" aria-live="polite"></p><button id="folder-cancel" class="secondary" type="button" hidden>取消选择，手动填写路径</button><label class="check"><input type="checkbox" id="edits">允许申请修改文件，每次修改均由我确认差异</label><p>仅访问此目录。不会授予命令执行或系统配置权限，也不会提供模型密钥或内部对话。</p><button id="allow" type="button">允许并连接</button><button id="re-pair" class="secondary" type="button">重新核对</button></section>
<section id="session" hidden><h2>当前协助</h2><p id="scope"></p><button id="pause" type="button">暂停协助</button></section>
<section id="change" hidden aria-labelledby="change-title"><h2 id="change-title">确认本次文件修改</h2><p id="file"></p><p>25 秒内确认；拒绝、暂停或超时均不执行本次修改。</p><pre id="diff" tabindex="0"></pre><button id="accept" type="button">允许本次修改</button><button id="reject" class="secondary" type="button">拒绝修改</button></section>
<section><h2>操作记录</h2><pre id="logs" tabindex="0">暂无操作。</pre></section>
<footer><button id="end" class="secondary" type="button">结束协助并退出连接器</button><p>请保持此页打开。关闭或刷新页面会结束协助；浏览器异常退出或未能通知时，连接器最迟在 2 分钟内撤销退出。立即结束请点击上方按钮。</p></footer></main></body></html>
